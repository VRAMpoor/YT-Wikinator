[package]
name = "ytc"
version = "0.1.0"
edition = "2021"
description = "Autonomous YouTube Librarian & Knowledge Wiki Creator"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "process", "time", "fs", "net", "signal"] }
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
anyhow = "1.0"
tempfile = "3.10"
colored = "2.1"
quick-xml = { version = "0.35", features = ["serialize"] }
axum = "0.7"
